# 應用名稱
spring.application.name=Zupder

# 服務器端口
server.port=8080

# 數據庫配置（請根據實際情況修改）
spring.datasource.url=jdbc:mysql://localhost:3306/zupder?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
# ddl-auto 選項：
# - none: 不做任何操作
# - validate: 驗證數據庫結構，不會創建或更新表
# - update: 更新數據庫結構（如果表不存在則創建，存在則更新）
# - create: 每次啟動都刪除並重新創建表（慎用！）
# - create-drop: 啟動時創建表，關閉時刪除表（慎用！）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 如果數據庫連接失敗，允許應用繼續啟動（僅用於開發環境）
spring.datasource.continue-on-error=false

# 是否在啟動時執行 schema.sql 和 data.sql
# 如果設置為 true，會自動執行 resources 目錄下的 schema.sql 和 data.sql
spring.sql.init.mode=never

# 文件上傳配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# 文件存儲配置
file.upload.dir=./uploads
# 分片大小（字節），默認5MB = 5242880字節
file.chunk.size=5242880

# 安全配置
# 最大失敗嘗試次數（超過此次數將鎖定IP）
security.max-failed-attempts=5
# IP鎖定時長（分鐘）
security.lockout-duration-minutes=15
# 嘗試時間窗口（分鐘），在此時間窗口內最多嘗試20次
security.attempt-window-minutes=10
